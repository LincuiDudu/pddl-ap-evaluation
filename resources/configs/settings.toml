[default]

[default.LLM]
model_host = "deepseek_r1_ollama"
max_tokens = 6144

[default.LLM.models]
# Remote models — large / reasoning
claude      = "claude-sonnet-4-5"
gpt4        = "gpt-4o-mini"
deepseek_r1 = "deepseek-reasoner"          # DeepSeek R1 reasoning model (paid)
qwen_max    = "qwen-max"                   # Qwen largest model (FREE quota)
mistral_large = "mistral-large-latest"     # Mistral large (paid)
groq_llama  = "llama-3.3-70b-versatile"   # Groq Llama 3.3 70B (FREE)
# Remote models — mid-tier
qwen        = "qwen-plus"
deepseek    = "deepseek-chat"
gemini      = "gemini-2.0-flash"
zhipu       = "glm-4-flash"
mistral_small = "mistral-small-latest"     # Mistral small (FREE tier)
groq_mixtral  = "mixtral-8x7b-32768"      # Groq Mixtral 8x7B (FREE)
# Local models (served via vLLM)
# Pin revision= at vLLM server start for full reproducibility, e.g.:
#   --revision a1b2c3d  (commit hash from huggingface.co/Qwen/Qwen2.5-7B-Instruct/commits)
qwen3b       = "Qwen/Qwen2.5-3B-Instruct"
qwen7b       = "Qwen/Qwen2.5-7B-Instruct"
qwen14b      = "Qwen/Qwen2.5-14B-Instruct"
qwen7b_coder = "Qwen/Qwen2.5-Coder-7B-Instruct"
# Ollama (LAN machine)
deepseek_r1_ollama = "deepseek-r1:7b"

[default.LLM.endpoints]
deepseek = "https://api.deepseek.com"
qwen     = "https://dashscope.aliyuncs.com/compatible-mode/v1"
zhipu    = "https://open.bigmodel.cn/api/paas/v4"
mistral  = "https://api.mistral.ai/v1"
groq     = "https://api.groq.com/openai/v1"
vllm     = "http://localhost:8000/v1"
ollama   = "http://192.168.178.27:11434/v1"

# Reproducibility defaults for local (vLLM) inference
[default.LLM.local]
temperature = 0.0
top_p       = 1.0
seed        = 42

[default.Generation]
system_prompt_template = "resources/prompt/generation/context.jinja"
query_template = "resources/prompt/generation/query.jinja"

[default.FewShot]
mode = "none"          # "none", "random", "fixed"
num_examples = 0       # 0 = zero-shot, 2-5 recommended for few-shot
dataset_dir = "resources/data/CVE-PDDL-NNL-ReAP"
seed = 42
# fixed_keys = ["CVE-2022-1471 / AP1", "CVE-2023-6378 / AP1"]  # used when mode = "fixed"

[default.Evaluation]
metric_ff = "tools/Metric-FF/ff"
enhsp     = "tools/enhsp/enhsp.jar"

[default.Experiment]
input_file = "resources/data/target_pool.json"
output_dir = "experiments"
max_optional = 3
